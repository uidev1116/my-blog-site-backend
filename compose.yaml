services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mariadb-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - default

  web:
    image: atsu666/acms:8.3
    depends_on:
      - db
    environment:
      TZ: Asia/Tokyo
    volumes:
      - ./ablogcms:/var/www/html
      - ./plugins:/var/www/plugins
      - /etc/localtime:/etc/localtime:ro
    networks:
      - default

volumes:
  mariadb-data:
