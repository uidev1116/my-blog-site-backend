<table class="adminTable acms-admin-table-admin-edit">
	<tr>
		<th><!--T-->表示順<!--/T--><i class="acms-admin-icon-tooltip js-acms-tooltip-hover" data-acms-tooltip="<!--T-->どのようなルールに従って表示されるかの設定です。<!--/T-->"></i></th>
		<td>
			<select name="category_flat_order" class="js-select2">
				<option value="amount-asc"{category_flat_order:selected#amount-asc}><!--T-->エントリー数<!--/T--> <!--T-->( 昇順 )<!--/T--></option>
				<option value="amount-desc"{category_flat_order:selected#amount-desc}><!--T-->エントリー数<!--/T--> <!--T-->( 降順 )<!--/T--></option>
				<option value="sort-asc"{category_flat_order:selected#sort-asc}><!--T-->表示順<!--/T--> <!--T-->( 昇順 )<!--/T--></option>
				<option value="sort-desc"{category_flat_order:selected#sort-desc}><!--T-->表示順<!--/T--> <!--T-->( 降順 )<!--/T--></option>
				<option value="code-asc"{category_flat_order:selected#code-asc}><!--T-->コードネーム<!--/T--> <!--T-->( 昇順 )<!--/T--></option>
				<option value="code-desc"{category_flat_order:selected#code-desc}><!--T-->コードネーム<!--/T--> <!--T-->( 降順 )<!--/T--></option>
				<option value="id-asc"{category_flat_order:selected#id-asc}>ID <!--T-->( 昇順 )<!--/T--></option>
				<option value="id-desc"{category_flat_order:selected#id-desc}>ID <!--T-->( 降順 )<!--/T--></option>
			</select>
			<input type="hidden" name="config[]" value="category_flat_order" />
		</td>
	</tr>
	<tr>
		<th><!--T-->エントリーの有無<!--/T--><i class="acms-admin-icon-tooltip js-acms-tooltip-hover" data-acms-tooltip="<!--T-->チェックをするとエントリーが登録されていないカテゴリーも表示します。<!--/T-->"></i></th>
		<td>
			<input type="hidden" name="category_flat_amount_zero" value="off" />
			<div class="acms-admin-form-checkbox">
				<input type="checkbox" name="category_flat_amount_zero" value="on"{category_flat_amount_zero:checked#on} id="input-checkbox-category_flat_amount_zero" />
				<label for="input-checkbox-category_flat_amount_zero"><i class="acms-admin-ico-checkbox"></i><!--T-->エントリーが登録されていないカテゴリーも表示する<!--/T--></label>
			</div>
			<input type="hidden" name="config[]" value="category_flat_amount_zero" />
		</td>
	</tr>
	<tr>
		<th><!--T-->エントリー数<!--/T--><i class="acms-admin-icon-tooltip js-acms-tooltip-hover" data-acms-tooltip="<!--T-->チェックをすると各カテゴリーに登録されているエントリー数を表示します。<!--/T-->"></i></th>
		<td>
			<input type="hidden" name="category_flat_amount" value="off" />
			<div class="acms-admin-form-checkbox">
				<input type="checkbox" name="category_flat_amount" value="on"{category_flat_amount:checked#on} id="input-checkbox-category_flat_amount" />
				<label for="input-checkbox-category_flat_amount"><i class="acms-admin-ico-checkbox"></i><!--T-->エントリー数を表示する<!--/T--></label>
			</div>
			<input type="hidden" name="config[]" value="category_flat_amount" />
		</td>
	</tr>
	<tr>
		<th><!--T-->サブカテゴリーエントリー数<!--/T--><i class="acms-admin-icon-tooltip js-acms-tooltip-hover" data-acms-tooltip="<!--T-->チェックをするとサブカテゴリーに登録されているエントリー数もカウントします。<!--/T-->"></i></th>
		<td>
			<input type="hidden" name="category_flat_count_entries_in_subcategories" value="off" />
			<div class="acms-admin-form-checkbox">
				<input type="checkbox" name="category_flat_count_entries_in_subcategories" value="on"{category_flat_count_entries_in_subcategories:checked#on} id="input-checkbox-category_flat_count_entries_in_subcategories" />
				<label for="input-checkbox-category_flat_count_entries_in_subcategories"><i class="acms-admin-ico-checkbox"></i><!--T-->サブカテゴリーに登録されているエントリー数もカウントする<!--/T--></label>
			</div>
			<input type="hidden" name="config[]" value="category_flat_count_entries_in_subcategories" />
		</td>
	</tr>
	<tr>
		<th><!--T-->階層<!--/T--><i class="acms-admin-icon-tooltip js-acms-tooltip-hover" data-acms-tooltip="<!--T-->表示するカテゴリーの階層の深さの設定です。数値で指定します。<!--/T-->"></i></th>
		<td>
			<input type="text" name="category_flat_level" value="{category_flat_level}" size="4" class="acms-admin-form-width-mini" />
			<input type="hidden" name="config[]" value="category_flat_level" />
		</td>
	</tr>
	<tr>
		<th><!--T-->ループ内クラス<!--/T--><i class="acms-admin-icon-tooltip js-acms-tooltip-hover" data-acms-tooltip="<!--T-->指定したクラスをループブロック内に設定できます。例えばグリッドシステムのカラム数設定などにご利用ください。<!--/T-->"></i></th>
		<td>
			<input type="text" name="category_flat_loop_class" value="{category_flat_loop_class}" size="4" class="acms-admin-form-width-medium" />
			<input type="hidden" name="config[]" value="category_flat_loop_class" />
		</td>
	</tr>
	<tr>
		<th><!--T-->親要素クラス<!--/T--><i class="acms-admin-icon-tooltip js-acms-tooltip-hover" data-acms-tooltip="<!--T-->ループ全体のラッパーに付与するクラスを指定できます。<!--/T-->"></i></th>
		<td>
			<input type="text" name="category_flat_parent_loop_class" value="{category_flat_parent_loop_class}" size="4" class="acms-admin-form-width-medium" />
			<input type="hidden" name="config[]" value="category_flat_parent_loop_class" />
		</td>
	</tr>
	<tr>
		<th><!--T-->フィールド検索<!--/T--><i class="acms-admin-icon-tooltip js-acms-tooltip-hover" data-acms-tooltip="<!--T-->絞り込むフィールドを選択します。<!--/T-->"></i></th>
		<td>
			<select name="category_flat_field_search" class="js-select2">
				<option value="entry"{category_flat_field_search:selected#entry}><!--T-->エントリー<!--/T--></option>
				<option value="category"{category_flat_field_search:selected#category}><!--T-->カテゴリー<!--/T--></option>
			</select>
			<input type="hidden" name="config[]" value="category_flat_field_search" />
		</td>
	</tr>
	<tr>
		<th><!--T-->カスタムフィールド<!--/T--><i class="acms-admin-icon-tooltip js-acms-tooltip-hover" data-acms-tooltip="<!--T-->チェックをするとカスタムフィールドを出力できます。<!--/T-->"></i></th>
		<td>
			<input type="hidden" name="category_flat_field" value="off" />
			<div class="acms-admin-form-checkbox">
				<input type="checkbox" name="category_flat_field" value="on"{category_flat_field:checked#on} id="input-checkbox-category_flat_field" />
				<label for="input-checkbox-category_flat_field"><i class="acms-admin-ico-checkbox"></i><!--T-->カスタムフィールド<!--/T--></label>
			</div>
			<input type="hidden" name="config[]" value="category_flat_field" />
		</td>
	</tr>
	<tr>
		<th><!--T-->位置情報<!--/T--><i class="acms-admin-icon-tooltip js-acms-tooltip-hover" data-acms-tooltip="<!--T-->チェックをすると位置情報を出力できるようになります。<!--/T-->"></i></th>
		<td>
			<input type="hidden" name="category_flat_geolocation_on" value="off" />
			<div class="acms-admin-form-checkbox">
				<input type="checkbox" name="category_flat_geolocation_on" value="on"{category_flat_geolocation_on:checked#on} id="input-checkbox-category_flat_geolocation_on" />
				<label for="input-checkbox-category_flat_geolocation_on"><i class="acms-admin-ico-checkbox"></i><!--T-->位置情報を表示できるようにする<!--/T--></label>
			</div>
			<input type="hidden" name="config[]" value="category_flat_geolocation_on" />
		</td>
	</tr>
</table><!-- BEGIN_MODULE Admin_Rule_Name -->
<input type="hidden" name="rid" value="{rid}" /><!-- END_MODULE Admin_Rule_Name --><!-- BEGIN_MODULE Admin_Module_Name -->
<input type="hidden" name="mid" value="{mid}" /><!-- END_MODULE Admin_Module_Name --><!-- BEGIN_MODULE Admin_Config_Set_Name -->
<input type="hidden" name="setid" value="{setid}" /><!-- END_MODULE Admin_Config_Set_Name -->
