<link href="/css/acms-system.min.css" rel="stylesheet">

<div class="acms-admin-modal acms-admin-layout-module-edit out" data-acms-admin-frame>
  <div class="acms-admin-modal-dialog large" role="dialog" aria-modal aria-labelledby="acms-admin-module-list-modal-title">
    <div class="acms-admin-modal-content clearfix">
      <header class="acms-admin-modal-header">
        <h1 id="acms-admin-module-list-modal-title" class="acms-admin-modal-heading"><!--T-->モジュール選択<!--/T--></h1>
        <button type="button" class="acms-admin-modal-hide">
          <i class="acms-admin-icon-delete"></i>
          <span class="acms-admin-hide-visually">閉じる</span>
        </button>
      </header>
      <div class="acms-admin-modal-body acms-admin-modal-body-fit">
        <div class="acms-admin-form">
          <div class="acms-grid">
            <div class="acms-admin-col-4 acms-admin-p-0">
              <!-- BEGIN_MODULE Admin_Module_Index -->
              <div class="acms-admin-filter acms-admin-filter-fit">
                <button class="js-acms_layout_create_module acms-admin-btn acms-admin-btn-success acms-admin-float-right acms-admin-margin-bottom-small" data-mid="new"><!--T-->モジュールIDを作成<!--/T--></button>
                <div>
                  <label for="searchModuleId" class="acms-admin-hide-visually"><!--T-->クイック検索<!--/T--></label>
                  <input type="text" id="searchModuleId" class="js-incremental_search_box acms-admin-form-width-full acms-admin-font" placeholder="&#xe99e 例）banner">
                </div>
              </div>
              <!-- BEGIN index#notFound -->
              <div class="acms-admin-alert acms-admin-alert-icon acms-admin-alert-danger">
                <span class="acms-admin-icon acms-admin-icon-attention acms-admin-alert-icon-before" aria-hidden="true"></span>
                <!--T-->モジュールIDがありません。<!--/T-->
                <button
                  type="button"
                  class="js-acms-alert-close acms-admin-alert-icon-after"
                >
                  ×
                </button>
              </div>
              <!-- END index#notFound -->
              <!-- BEGIN modules:veil -->
              <div class="js-resize_to_window_height acms-admin-layout-scroll-area acms-admin-layout-sidebar acms-admin-bg-light-gray acms-admin-p-0" data-offset="200">
                <ul class="js-module_index_table js-incremental_search">
                  <!-- BEGIN modules:loop -->
                  <li class="search_element acms-admin-layout-sidebar-item js-layout_preview_module_id" data-mid="{id}" data-tpl="<!-- BEGIN_IF [{id}/eq/%{mid}] -->%{tpl}<!-- END_IF -->">
                    <div class="acms-admin-layout-sidebar-item-inner">
                      <div class="acms-admin-layout-sidebar-item-cell">
                        <div class="acms-admin-layout-sidebar-item-sub clearfix">
                          <p class="acms-admin-float-left">
                            <span class="acms-admin-label acms-admin-margin-right-mini acms-admin-label-min-width">{id}</span>
                          </p>
                          <p class="acms-admin-float-left"><!-- BEGIN_IF [{id}/eq/%{mid}] -->
                            <span class="acms-admin-label acms-admin-label-success acms-admin-margin-right-mini acms-admin-label-min-width"><!--T-->選択中<!--/T--></span><!-- END_IF -->
                          </p>
                          <p class="acms-admin-float-left">{identifier}</p>
                          <p class="acms-admin-float-right">{name}</p>
                        </div>
                        <div class="acms-admin-layout-sidebar-item-main-inner">
                          <div class="acms-admin-layout-sidebar-item-cell acms-admin-layout-sidebar-item-cell-full acms-admin-text-ellipsis-table-cell">
                            <p class="acms-admin-layout-sidebar-item-main acms-admin-text-ellipsis"> {label}</p>
                          </div>

                          <div class="acms-admin-layout-sidebar-item-cell acms-table-nowrap">
                            <!-- BEGIN_IF [{scope}/eq/global] -->
                            <span class="acms-admin-label acms-admin-label-info acms-admin-text-nowrap"><!--T-->グローバル<!--/T--></span>
                            <!-- END_IF -->
                          </div>
                        </div>
                      </div>
                    </div>
                  </li>
                  <!-- END modules:loop -->
                </ul>
              </div><!-- END modules:veil -->
              <!-- END_MODULE Admin_Module_Index -->
            </div>

            <div class="acms-admin-col-8 acms-admin-p-0">
              <div class="acms-admin-layout-scroll-area">
                <div id="js-module_info_tpl" style="display:none;"
                     data-empty-message="<!--T-->サイドバーからモジュールを選択すると、プレビューが表示されます<!--/T-->"
                     data-global-label="<!--T-->グローバル<!--/T-->"
                     data-duplicate-label="<!--T-->複製<!--/T-->"
                     data-settings-label="<!--T-->設定<!--/T-->"
                     data-select-label="<!--T-->選択する<!--/T-->"
                     data-preview-label="<!--T-->プレビュー<!--/T-->"
                     data-preview-scale-label="<!--T-->75%表示<!--/T-->"
                     data-default-tpl="%{tpl}">
                </div>
                <div id="js-module_info_box" class="acms-admin-padding-large">
                  <p class="acms-admin-alert acms-admin-alert-icon acms-admin-alert-info">
                    <span class="acms-admin-icon acms-admin-icon-news acms-admin-alert-icon-before" aria-hidden="true"></span>
                    <!--T-->サイドバーからモジュールを選択すると、プレビューが表示されます<!--/T-->
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
