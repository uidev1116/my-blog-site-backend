<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/acms-code/snippets/src/snippets.css"/>
  <script src="/acms-code/snippets/src/snippets.js"></script>
</head>
<body>
<h1>Ogp</h1>
<textarea>
&lt;!-- BEGIN_MODULE Ogp --&gt;
&lt;title&gt;{title}&lt;/title&gt;
&lt;meta property="og:url" content="&#x25;{PERMALINK}"&gt;
&lt;meta property="og:site_name" content="&#x25;{ROOT_BLOG_NAME}"&gt;
&lt;meta property="og:title" content="{title}"&gt;
&lt;meta property="og:type" content="{type}"&gt;
&lt;!-- BEGIN_IF [{description}[delnl]/nem/] --&gt;
&lt;meta property="og:description" content="{description}[mb_trim(350, '...')|delnl|escape]"&gt;&lt;!-- END_IF --&gt;&lt;!-- BEGIN_IF [{image}/nem/] --&gt;
&lt;!-- BEGIN_IF [{image@type}/eq/media] --&gt;
&lt;meta property="og:image" content="&#x0025;{HTTP_MEDIA_ARCHIVES_DIR}{image}"&gt;
&lt;meta property="og:image:secure_url" content="&#x0025;{HTTP_MEDIA_ARCHIVES_DIR}{image}" /&gt;
&lt;!-- ELSE --&gt;
&lt;meta property="og:image" content="&#x0025;{HTTP_ARCHIVES_DIR}{image}"&gt;
&lt;meta property="og:image:secure_url" content="&#x0025;{HTTP_ARCHIVES_DIR}{image}" /&gt;
&lt;!-- END_IF --&gt;
&lt;meta property="og:image:width" content="{image@x}" /&gt;
&lt;meta property="og:image:height" content="{image@y}" /&gt;&lt;!-- END_IF --&gt;&lt;!-- BEGIN_IF [{description}[delnl]/nem/] --&gt;
&lt;meta name="description" content="{description}[mb_trim(350, '...')|delnl|escape]"&gt;&lt;!-- END_IF --&gt;&lt;!-- BEGIN_IF [{keywords}/nem/] --&gt;
&lt;meta name="keywords" content="{keywords}"&gt;&lt;!-- END_IF --&gt;
&lt;!-- END_MODULE Ogp --&gt;
</textarea>
</body>
</html>
